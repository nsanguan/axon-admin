# =============================================================================
# /etc/nginx/sites-available/60-axon-admin.conf — eraowl-s03
# axon-admin.era-ai-consultant.com
#   → Next.js web  : axon-admin-web  container :3200 (host) / :3000 (container)
#   → NestJS API   : axon-admin-api  container :3001
#
# Enable : ln -s /etc/nginx/sites-available/60-axon-admin.conf \
#                /etc/nginx/sites-enabled/60-axon-admin.conf
# Disable: rm /etc/nginx/sites-enabled/60-axon-admin.conf
# Reload : nginx -t && systemctl reload nginx
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTPS — AXON Admin UI (Next.js) ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name axon-admin.era-ai-consultant.com;

    ssl_certificate     /etc/ssl/internal/s03.crt;
    ssl_certificate_key /etc/ssl/internal/s03.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log  /var/log/nginx/axon-admin.access.log  main;
    error_log   /var/log/nginx/axon-admin.error.log   warn;

    # ── NestJS API + WebSocket ────────────────────────────────────────────
    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Socket.IO ─────────────────────────────────────────────────────────
    location /socket.io {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Static assets (Next.js) ───────────────────────────────────────────
    location ~* \.(js|css|png|jpg|ico|svg|woff2|ttf|json|map|wasm)$ {
        proxy_pass http://127.0.0.1:3200;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Next.js frontend (everything else) ───────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Health check ──────────────────────────────────────────────────────
    location /health {
        access_log off;
        proxy_pass http://127.0.0.1:3001/api/health;
        proxy_set_header Host $host;
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name axon-admin.era-ai-consultant.com;
    return 301 https://$server_name$request_uri;
}
