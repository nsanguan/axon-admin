apiVersion: apps/v1
kind: Deployment
metadata:
  name: axon-admin-web
  namespace: axon-admin
  labels:
    app: axon-admin-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: axon-admin-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: axon-admin-web
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: axon-admin/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: axon-admin-config
            - secretRef:
                name: axon-admin-secrets
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
