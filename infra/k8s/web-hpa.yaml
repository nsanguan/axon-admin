apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: axon-admin-web-hpa
  namespace: axon-admin
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: axon-admin-web
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
