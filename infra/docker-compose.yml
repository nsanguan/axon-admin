services:
  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    container_name: axon-admin-api
    ports:
      - "3001:3001"
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://axon-redis-central:6379
    depends_on: []
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - axon-global-network
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://202.71.1.13:3001
    container_name: axon-admin-web
    ports:
      - "3200:3000"
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://202.71.1.13:3001
    depends_on:
      api:
        condition: service_healthy
    networks:
      - axon-global-network
    restart: unless-stopped

networks:
  axon-global-network:
    external: true
